[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-desk"
version = "0.1.0"
description = "A local coordination ledger and event-driven dispatcher for agent teams"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Agent Desk contributors"}]
dependencies = []

[project.scripts]
agent-desk = "agent_desk.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_desk*"]

[tool.setuptools.package-data]
agent_desk = ["static/*"]
